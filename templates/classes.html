{% extends "base.html" %}{% block content %}<h1>Manage Classes</h1><div class="panel"><form method="post" class="inline"><div><label>Class name</label><input name="name" placeholder="Example: CSE-A" required></div><button>Create Class</button></form></div>
<div class="panel"><h2>Classes</h2><table><tr><th>Class</th><th>Students</th><th>Attendance</th><th>Marks</th></tr>{% for c in classes %}<tr><td>{{c.name}}</td><td>{{c.student_count}}</td><td><a href="{{url_for('class_attendance',class_id=c.id)}}">Take attendance</a></td><td><a href="{{url_for('class_marks',class_id=c.id)}}">Enter marks</a></td></tr>{% else %}<tr><td colspan="4">No classes created.</td></tr>{% endfor %}</table></div>{% endblock %}
