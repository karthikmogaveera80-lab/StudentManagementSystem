{% extends "base.html" %}{% block content %}<div class="heading"><h1>Students</h1><a class="button" href="{{url_for('add_student')}}">+ Add Student</a></div>
<div class="panel"><form method="get" class="inline"><div><input name="q" value="{{q}}" placeholder="Search name, roll number, department or class"></div><button>Search</button></form><table><tr><th>Name</th><th>Roll No</th><th>Department</th><th>Year</th><th>Class</th><th>Actions</th></tr>{% for s in students %}<tr><td>{{s.name}}</td><td>{{s.roll_no}}</td><td>{{s.department}}</td><td>{{s.year}}</td><td>{{s.class_name or 'Not assigned'}}</td><td><a href="{{url_for('edit_student',student_id=s.id)}}">Edit</a> | <a href="{{url_for('report',student_id=s.id)}}">Report</a> | <form class="inline" method="post" action="{{url_for('delete_student',student_id=s.id)}}" onsubmit="return confirm('Delete this student?')"><button class="danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="6">No students found.</td></tr>{% endfor %}</table></div>{% endblock %}
