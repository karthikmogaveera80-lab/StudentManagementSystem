{% extends "base.html" %}{% block content %}<h1>{{'Edit' if student else 'Add'}} Student</h1><div class="panel"><form method="post"><div class="grid">
<div><label>Roll number *</label><input name="roll_no" required value="{{student.roll_no if student else ''}}"></div><div><label>Full name *</label><input name="name" required value="{{student.name if student else ''}}"></div>
<div><label>Email</label><input type="email" name="email" value="{{student.email if student else ''}}"></div><div><label>Phone</label><input name="phone" value="{{student.phone if student else ''}}"></div>
<div><label>Department *</label><input name="department" required value="{{student.department if student else ''}}"></div><div><label>Year *</label><select name="year" required><option value="">Select year</option>{% for y in range(1,5) %}<option value="{{y}}" {% if student and student.year==y %}selected{% endif %}>Year {{y}}</option>{% endfor %}</select></div>
<div><label>Class</label><select name="class_id"><option value="">Not assigned</option>{% for c in classes %}<option value="{{c.id}}" {% if student and student.class_id==c.id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></div></div><button>Save Student</button></form></div>{% endblock %}
